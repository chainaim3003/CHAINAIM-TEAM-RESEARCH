name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Evals and guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        # The package, its pyproject.toml and uv.lock all live here, and the
        # README's documented commands are run from this directory.
        working-directory: chainaim-deep-research

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Step 1 of the README's test sequence: code only, no config, no network.
      - name: Evals
        run: uv run evals/run_evals.py

      # Step 2 of the README's test sequence: confirms ANTHROPIC_API_KEY is
      # unset, so the pipeline stays in subscription mode and cannot silently
      # start billing an API key. CI is the right place to enforce this.
      - name: Provider guardrails
        run: uv run scripts/orchestrate.py --provider-check
