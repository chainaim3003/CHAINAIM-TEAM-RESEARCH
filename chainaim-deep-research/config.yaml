# ChainAIM Deep Research Agent — config.yaml
# SHARED, language-independent. Keys here are the PUBLIC INTERFACE (see
# DESIGN/01-architecture-contract.md section 3). Python and TypeScript runtimes
# both consume this file identically.
#
# PATH RULES:
#   - Relative paths are anchored to THIS package dir (the folder holding config.yaml),
#     not your shell's current directory — so runs are reproducible from any cwd.
#   - Absolute paths are used as-is.
#   - `../GENERAL-RESEARCH/...` therefore points at the GENERAL-RESEARCH folder that sits
#     one level up, beside this package, under the repo root CHAINAIM-TEAM-RESEARCH.

input:
  # Optional single list file (URLs / 11-char IDs, one per line; '#' comments ok).
  # null = don't use a single list file; rely on source_dir below.
  source_list: null
  # Directory scanned for *.txt / *.md files, each containing source lines.
  # Local working input area (relative -> ../GENERAL-RESEARCH/input).
  source_dir: "../GENERAL-RESEARCH/input"

output:
  # KB + manifest + ledger root. Local working output area
  # (relative -> ../GENERAL-RESEARCH/output). Was the repo root; kept here for easy revert:
  # kb_dir: "C:/SATHYA/CHAINAIM3003/mcp-servers/CHAINAIM-TEAM/RESEARCH/CHAINAIM-TEAM-RESEARCH"
  kb_dir: "../GENERAL-RESEARCH/output"
  full_dir: "kb/full"               # extracted raw content (relative to kb_dir)
  highlights_dir: "kb/highlights"   # synthesized entries (relative to kb_dir) — V2+ / manual V1
  manifest: "manifest.json"         # dedupe ledger (relative to kb_dir)
  prompts_dir: "kb/prompts"         # ready-to-paste AI prompts, one per transcript (build_kb_pack.py)
  min_summary_chars: 200            # PR-8: shorter saved summaries are flagged CHECK in INDEX.md
  prompt_template: "synth/manual_prompt.md"   # template for those prompts (relative to this package dir)
  prompt_template_repo: "synth/manual_prompt_repo.md"   # template used for GitHub repo entries (PR-5)
  prompt_templates_by_kind:         # PR-7: template per manifest kind (others use prompt_template)
    github_repo: "synth/manual_prompt_repo.md"
    arxiv_paper: "synth/manual_prompt_paper.md"
    web_article: "synth/manual_prompt_article.md"
  formats: ["txt"]                  # extracted formats to write: any of txt, md, json
  # PR-2 file naming. "title_id" -> "<Title> [<id>].txt" (title from YouTube oEmbed, free, no key;
  # falls back to "<id>" with a warning if the lookup fails). "id" -> "<id>.txt" (no lookup).
  # Override per run with --naming.
  naming: "title_id"
  max_stem_len: 100                 # max file-name length without extension (keeps Windows paths < 260)

github:
  # PR-5: GitHub repo/account links -> kb/full/<owner>__<repo> [github].md (no AI, GitHub REST API).
  # Token is optional (public repos work without it: 60 requests/hour). Put GITHUB_TOKEN in the
  # repo-root .env (git-ignored) for 5,000 requests/hour and private repos you can read.
  token_env: "GITHUB_TOKEN"
  max_repos: 20                     # per account link (most recently pushed first)
  include_forks: false
  include_archived: false
  max_tree_entries: 400             # paths shown in the folder listing
  max_files: 15                     # key files included (package.json, pyproject.toml, docs/*.md, ...)
  max_file_bytes: 50000             # per key file
  max_total_bytes: 300000           # README + key files together
  min_delay_s: 0.5                  # pause between GitHub API calls
  min_remaining: 5                  # stop before the rate limit is fully used
  timeout_s: 20

arxiv:
  # PR-7: arXiv links -> kb/full/<title> [arxiv-<id>].md (no AI). Metadata via the free export API,
  # full text via arXiv's HTML version, else the PDF. arXiv API terms: max 1 request per 3 seconds.
  min_delay_s: 3.0
  timeout_s: 30
  max_chars: 400000                 # full-text cap (cut is stated in the file)
  min_fulltext_chars: 2000          # HTML shorter than this -> fall back to the PDF

web:
  # PR-7: any other http(s) link -> kb/full/<title> [web-<hash>].md (main text via trafilatura, no AI).
  min_chars: 300                    # less main text than this = failure (JS/login/paywall page)
  max_chars: 300000

youtube:
  # In-repo skill, vendored under <repo>/agent-skills. RELATIVE to THIS package dir
  # (anchored by orchestrate._anchor, NOT the shell cwd) -> portable across machines/clones.
  transcript_script: "../agent-skills/skills/youtube-transcript/scripts/get_transcript.py"
  timestamps: false                 # default; overridable per-run with --timestamps / --no-timestamps
  title_lookup:                     # oEmbed title lookup used when output.naming = title_id
    timeout_s: 10.0                 # per-request timeout
    retries: 2                      # extra attempts on network errors / HTTP 5xx (4xx = final)
    backoff_s: 1.0                  # first retry delay; doubles each retry
  throttle:
    min_delay_s: 2.0                # minimum seconds between extractor calls
    jitter_s: 1.0                   # random 0..jitter added to each delay
    backoff_factor: 2.0             # multiplier applied on retry
    max_retries: 3                  # attempts per source before giving up

cost:
  token_budget_per_run: 200000      # hard ceiling; orchestrator checkpoints + stops on breach
  ledger: "cost_ledger.jsonl"       # relative to kb_dir; one JSON object appended per run

synthesis:
  levels: ["tldr", "highlights", "deep"]   # leveled output (deep => Opus; see cost-model)
  judge_max_retries: 2              # evaluator-optimizer loop cap (V2+)

model:
  provider: "subscription"     # subscription = Claude MAX via claude -p ; api = ANTHROPIC_API_KEY
  deployment: "internal"       # internal allows subscription; product forbids it (forces api)
  route:
    classify: "haiku"
    synthesize: "sonnet"
    deep: "opus"
    judge: "sonnet"
  api_key_env: "ANTHROPIC_API_KEY"
  oauth_token_env: "CLAUDE_CODE_OAUTH_TOKEN"
