[project]
name = "chainaim-deep-research"
version = "0.1.0"
description = "ChainAIM Deep Research Agent — AI-free extraction (YouTube, GitHub, arXiv, web) -> KB + ready-to-paste prompts"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    # PR-7 (no AI): web/article main-text extraction and arXiv HTML -> Markdown
    "trafilatura>=2.0",
    # PR-7 (no AI): text from arXiv PDFs when no HTML version exists
    "pypdf>=5.0",
    # PR-9 (no AI): local browser app (app/streamlit_app.py), served on 127.0.0.1 only
    "streamlit>=1.40",
]

# Optional: only needed if you run the API provider (provider=api). V1 + subscription
# mode do NOT need this. Install with: uv sync --extra api
[project.optional-dependencies]
api = ["anthropic>=0.40"]

[tool.uv]
package = false

# Extraction itself runs the free youtube-transcript skill via `uv run <script>`, which
# uses that script's own inline dependency header (youtube-transcript-api). It is NOT a
# dependency of this package.
